# Render 무료 서버 깨워 두기.
# Render 무료 플랜은 15분 동안 요청이 없으면 잠들고, 다시 깨는 데 30~60초 걸린다.
# 한국 시간 아침 8시~밤 10시에 10분마다 /health를 한 번씩 불러 잠들지 않게 한다.
# (cron은 UTC 기준이라 23시, 0~12시로 적었다. 밤에는 쉬게 둬서 Render 무료 시간(월 750시간)을 아낀다.)
#
# 발표 직전에는 이것만 믿지 말고, docs/DEPLOY.md의 "발표 전 체크"대로 직접 한 번 열어 보자.
# 끄고 싶으면 GitHub → Actions → keep-warm → "Disable workflow".
name: keep-warm

on:
  schedule:
    - cron: "*/10 23,0-12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://baf60081-team9.onrender.com/health)
          echo "health -> HTTP $code"
          test "$code" = "200"
