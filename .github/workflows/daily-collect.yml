# 공공 API 행사 매일 자동 수집.
# 배포된 백엔드(Render)의 POST /collect를 매일 새벽에 한 번 불러서 행사를 최신으로 유지한다.
# 진행 중 행사가 시간이 지나면 빠르게 줄어들어서(11/22 190건 → 12/23 22건 예상), 8주차 시연 전까지 계속 채워 둔다.
#
# 처음 한 번 준비 (저장소 관리자):
#   GitHub 저장소 → Settings → Secrets and variables → Actions → New repository secret
#   이름 COLLECT_TOKEN, 값은 Render 환경변수 COLLECT_TOKEN과 같은 값.
#
# 직접 돌려 보기: GitHub → Actions → daily-collect → Run workflow (dry_run을 켜면 저장하지 않고 결과만 본다)
# 끄고 싶으면: GitHub → Actions → daily-collect → "Disable workflow"
#
# 알아 둘 점
# - schedule은 main 브랜치에 합쳐져 있어야 돈다. 시각은 UTC 기준이라 한국 시간보다 9시간 이르게 적었다.
# - GitHub 사정에 따라 예약 실행이 몇 분~수십 분 늦을 수 있다.
# - 같은 행사는 다시 받아도 새로 만들지 않고 고쳐 쓴다(external_id 기준). 매일 돌려도 중복이 쌓이지 않는다.
# - 매달 2일에는 KOPIS 통계(POST /collect/kopis-stats)도 함께 받는다. 분석 페이지 지표용.
# - 상세 설명은 새 행사나 30일 넘게 확인하지 않은 행사만 불러서(detail=new) 호출 수가 거의 늘지 않는다.
name: daily-collect

on:
  schedule:
    - cron: "17 20 * * *"   # 매일 한국 시간 05:17 행사 수집
    - cron: "47 20 2 * *"   # 매달 2일 한국 시간 05:47 KOPIS 통계 수집
  workflow_dispatch:
    inputs:
      dry_run:
        description: "저장하지 않고 결과만 보기"
        type: boolean
        default: false
      days:
        description: "오늘부터 며칠 뒤까지의 행사 (1~60)"
        type: number
        default: 30
      with_stats:
        description: "KOPIS 통계도 함께 받기"
        type: boolean
        default: false

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_BASE: ${{ vars.API_BASE_URL || 'https://baf60081-team9.onrender.com' }}
      COLLECT_TOKEN: ${{ secrets.COLLECT_TOKEN }}
      STATS_CRON: "47 20 2 * *"
    steps:
      - name: 토큰 확인
        run: |
          if [ -z "$COLLECT_TOKEN" ]; then
            echo "::error::COLLECT_TOKEN 비밀값이 없어요. 저장소 Settings → Secrets and variables → Actions에 Render와 같은 값으로 등록해 주세요."
            exit 1
          fi

      - name: 서버 깨우기 (Render 무료 플랜은 잠들어 있으면 30~60초 걸림)
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 30 "$API_BASE/health" > /dev/null; then
              echo "서버 응답 확인 (${i}번째 시도)"
              exit 0
            fi
            echo "아직 깨는 중... (${i}/12)"
            sleep 15
          done
          echo "::error::서버가 3분 넘게 응답하지 않아요. Render 대시보드를 확인해 주세요."
          exit 1

      - name: 행사 수집 (POST /collect)
        if: github.event.schedule != env.STATS_CRON
        env:
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          DAYS: ${{ inputs.days || 30 }}
        run: |
          # 연결 실패·시간 초과면 curl이 -w로 "000"을 직접 찍는다. 여기에 "000"을 또 붙이면
          # "000000"이 되어 아래 재시도 조건에 안 걸리므로, 실패해도 그대로 둔다(|| true).
          call() {
            curl -sS --max-time 600 -o result.json -w "%{http_code}" -X POST \
              -H "x-collect-token: $COLLECT_TOKEN" \
              "$API_BASE/collect?days=$DAYS&dry_run=$DRY_RUN" || true
          }
          code=$(call)
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
            echo "응답 코드 $code, 60초 뒤 한 번 더 시도해요."
            sleep 60
            code=$(call)
          fi
          echo "응답 코드: $code"
          if [ "$code" != "200" ]; then
            echo "::error::수집 실패 (HTTP $code)"
            cat result.json || true
            exit 1
          fi
          jq '{window, dry_run, collected, inserted, updated, unchanged, results, text_coverage}' result.json
          {
            echo "## 행사 수집 결과"
            echo ""
            jq -r '"- 기간: \(.window.from) ~ \(.window.to)\n- 저장 안 함(dry run): \(.dry_run)\n- 받은 행사 \(.collected)건 · 새로 추가 \(.inserted)건 · 갱신 \(.updated)건 · 그대로 \(.unchanged)건"' result.json
            echo ""
            echo "| 출처 | 지역 | 받음 | 남김 | 건너뜀 | 오류 |"
            echo "|---|---|---|---|---|---|"
            jq -r '.results[] | "| \(.source) | \(.area) | \(.fetched) | \(.kept) | \(.skipped) | \(.error // "") |"' result.json
            echo ""
            echo "### 상세 설명 조회 (이번 실행)"
            echo ""
            echo "| 출처 | 지역 | 불러옴 | 설명 있음 | 실패 | 미룸 | 최근 확인이라 건너뜀 | 실패 사유 |"
            echo "|---|---|---|---|---|---|---|---|"
            jq -r '.results[] | select(.details != null) | "| \(.source) | \(.area) | \(.details.fetched) | \(.details.with_text) | \(.details.failed) | \(.details.deferred) | \(.details.skipped_recent) | \((.detail_failures // {}) | to_entries | map("\(.key) \(.value)건") | join(", ")) |"' result.json
            if jq -e '.text_coverage | length > 0' result.json > /dev/null 2>&1; then
              echo ""
              echo "### 설명 텍스트 충족률 (DB 전체)"
              echo ""
              echo "| 출처 | 행사 | 설명 있음 | 200자 이상 | 관람연령 있음 |"
              echo "|---|---|---|---|---|"
              jq -r '.text_coverage[] | "| \(.source) | \(.total) | \(.with_text) | \(.over_200) | \(.with_age) |"' result.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          errors=$(jq '[.results[] | select(.error != null and .error != "")] | length' result.json)
          if [ "$errors" -gt 0 ]; then
            echo "::warning::출처 ${errors}곳에서 오류가 있었어요. 위 표를 확인해 주세요."
          fi

      - name: KOPIS 통계 수집 (POST /collect/kopis-stats)
        if: github.event.schedule == env.STATS_CRON || inputs.with_stats
        env:
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          code=$(curl -sS --max-time 300 -o stats.json -w "%{http_code}" -X POST \
            -H "x-collect-token: $COLLECT_TOKEN" \
            "$API_BASE/collect/kopis-stats?dry_run=$DRY_RUN" || true)
          echo "응답 코드: $code"
          if [ "$code" != "200" ]; then
            echo "::error::KOPIS 통계 수집 실패 (HTTP $code)"
            cat stats.json || true
            exit 1
          fi
          head -c 2000 stats.json
          echo ""
          echo "## KOPIS 통계 수집 완료 (HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
