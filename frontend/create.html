<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>모임 만들기 · 같이 갈래?</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="styles.css?v=campus4">
</head>
<body>
  <div class="wrap">
    <nav class="topnav" data-active="create"></nav>

    <header class="hero with-buddy">
      <div>
        <div class="badge">캠퍼스에서 직접 여는 활동</div>
        <h1>같이 갈래?</h1>
        <p>러닝·스터디·번개처럼 API에 없는 활동도 올려요. “넙죽이”가 모집 글을 지켜봅니다.</p>
      </div>
      <img class="buddy-sm" data-mascot src="mascot.svg" alt="">
    </header>

    <div class="userbox" id="userBox"></div>

    <section class="panel">
      <div class="grid form-split">
        <div>
          <h2>새 활동 올리기</h2>
          <p class="hint">친구들이 바로 보고 참여할 수 있게, 장소와 시간만 분명하면 충분해요.</p>
          <form id="form" class="grid" style="gap:12px">
            <label>유형
              <select name="activity_type" required>
                <option>러닝</option><option>공연</option><option>축제</option><option>전시</option>
              </select>
            </label>
            <label>제목 <input name="title" required placeholder="예: 어은동 저녁 러닝"></label>
            <label>장소 <input name="place" placeholder="예: KAIST 창의학습관 앞"></label>
            <label>지역(구) <input name="region" placeholder="유성구"></label>
            <label>일시 <input name="starts_at" type="datetime-local"></label>
            <label>비용 <input name="cost" placeholder="무료 / 커피값"></label>
            <label>한줄 소개 <textarea name="description" placeholder="초보 환영! 끝나고 성심당 경유 가능"></textarea></label>
            <button type="submit" class="bun">올리고 사람 모으기</button>
          </form>
          <p class="status" id="status"></p>
        </div>
        <aside class="side-note">
          <img data-mascot src="mascot.svg" alt="넙죽이">
          <h3>같이 갈 사람 구해요</h3>
          <p>등록만 해두면 라이브 보드에 바로 뜹니다. 발표장에서도 QR로 친구들이 들어올 수 있어요.</p>
          <a href="live.html"><button type="button" class="secondary">라이브 보드 보기</button></a>
        </aside>
      </div>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const { api, renderUserBox, setStatus, UserStore } = window.Gachi;
    renderUserBox();
    if (!UserStore.get()) {
      setStatus(document.getElementById("status"), "닉네임 합류 후 올리면 모임 연결이 쉬워요.", true);
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const payload = {
        activity_type: fd.get("activity_type"),
        title: fd.get("title"),
        place: fd.get("place") || null,
        region: fd.get("region") || null,
        cost: fd.get("cost") || null,
        description: fd.get("description") || null,
        source: "user",
      };
      const starts = fd.get("starts_at");
      if (starts) payload.starts_at = starts;
      try {
        const a = await api("/activities", { method: "POST", body: JSON.stringify(payload) });
        setStatus(document.getElementById("status"), `등록 완료! 이제 같이 갈 사람을 모아요 (#${a.activity_id})`, true);
        setTimeout(() => { location.href = `activity.html?id=${a.activity_id}`; }, 700);
      } catch (err) {
        setStatus(document.getElementById("status"), err.message, false);
      }
    });
  </script>
</body>
</html>
