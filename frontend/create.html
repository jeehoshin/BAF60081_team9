<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>모임 만들기 · 같이 갈래?</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="styles.css?v=campus4">
</head>
<body>
  <div class="wrap">
    <nav class="topnav" data-active="create"></nav>

    <header class="hero with-buddy">
      <div>
        <div class="badge">캠퍼스에서 직접 여는 활동</div>
        <h1>같이 갈래?</h1>
        <p>러닝·스터디·번개처럼 API에 없는 활동도 올려요. “넙죽이”가 모집 글을 지켜봅니다.</p>
      </div>
      <img class="buddy-sm" data-mascot src="mascot.svg" alt="">
    </header>

    <div class="userbox" id="userBox"></div>

    <section class="panel">
      <div class="grid form-split">
        <div>
          <h2>새 러닝 활동 올리기</h2>
          <p class="hint">공연·축제·전시는 공공 API에서 자동으로 수집되며, 이용자는 러닝 활동을 직접 올릴 수 있어요.</p>
          <form id="form" class="grid" style="gap:12px">
            <label>유형
              <select name="activity_type" required>
                <option value="러닝">🏃 러닝 (이용자 직접 등록)</option>
              </select>
            </label>
            <label>제목 * <input name="title" required placeholder="예: 갑천 저녁 러닝 5km"></label>
            <div class="grid two">
              <label>장소 <input name="place" placeholder="예: KAIST 정문 시계탑"></label>
              <label>지역(구)
                <select name="region">
                  <option value="유성구">대전 유성구</option>
                  <option value="서구">대전 서구</option>
                  <option value="중구">대전 중구</option>
                  <option value="동구">대전 동구</option>
                  <option value="대덕구">대전 대덕구</option>
                  <option value="마포구">서울 마포구</option>
                  <option value="영등포구">서울 영등포구</option>
                  <option value="송파구">서울 송파구</option>
                  <option value="성동구">서울 성동구</option>
                  <option value="용산구">서울 용산구</option>
                  <option value="강남구">서울 강남구</option>
                  <option value="서초구">서울 서초구</option>
                  <option value="종로구">서울 종로구</option>
                </select>
              </label>
            </div>
            <div class="grid two">
              <label>일시 <input name="starts_at" type="datetime-local"></label>
              <label>비용 <input name="cost" value="무료" placeholder="무료 / 음료 각자"></label>
            </div>
            <label>한줄 소개 <textarea name="description" placeholder="초보 환영! 끝나고 성심당 경유 가능"></textarea></label>

            <div class="sub-box">
              <label class="check-row">
                <input type="checkbox" id="openMeetupNow" checked>
                <span><strong>첫 모임도 바로 함께 열기</strong> (체크하면 모임톡방이 바로 만들어져요)</span>
              </label>
              <div id="meetupExtra" class="grid" style="gap:10px; margin-top:10px">
                <div class="grid two">
                  <label>모임 이름 <input name="meetup_name" placeholder="비워두면 '제목 + 같이 뛰어요'"></label>
                  <label>정원 (4~20명) <input name="capacity" type="number" min="4" max="20" value="4"></label>
                </div>
                <div class="grid two">
                  <label>성별 조건
                    <select name="gender_filter">
                      <option value="">무관</option>
                      <option value="남">남성만</option>
                      <option value="여">여성만</option>
                    </select>
                  </label>
                  <label>연령대 조건
                    <select name="age_filter">
                      <option value="">무관</option>
                      <option value="20대">20대만</option>
                      <option value="30대">30대만</option>
                      <option value="40대">40대만</option>
                      <option value="50대 이상">50대 이상만</option>
                    </select>
                  </label>
                </div>
                <label>어떻게 모일까요? <input name="how" placeholder="예: 정문 집결 → 갑천 5km 조깅 → 치맥"></label>
              </div>
            </div>

            <button type="submit" class="bun">올리고 사람 모으기</button>
          </form>
          <p class="status" id="status"></p>
        </div>
        <aside class="side-note">
          <img data-mascot src="mascot.svg" alt="넙죽이">
          <h3>같이 갈 사람 구해요</h3>
          <p>등록만 해두면 라이브 보드에 바로 뜹니다. 발표장에서도 QR로 친구들이 들어올 수 있어요.</p>
          <a href="live.html"><button type="button" class="secondary">라이브 보드 보기</button></a>
        </aside>
      </div>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const { api, renderUserBox, setStatus, UserStore } = window.Gachi;
    renderUserBox();
    const openNowChk = document.getElementById("openMeetupNow");
    const extraBox = document.getElementById("meetupExtra");
    if (!UserStore.get()) {
      openNowChk.checked = false;
      extraBox.style.display = "none";
      setStatus(document.getElementById("status"), "닉네임 합류 후 올리면 첫 모임도 한 번에 열 수 있어요.", true);
    }
    openNowChk.addEventListener("change", () => {
      extraBox.style.display = openNowChk.checked ? "grid" : "none";
    });

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const title = fd.get("title");
      const starts = fd.get("starts_at");
      const place = fd.get("place") || null;
      const payload = {
        activity_type: "러닝",
        title,
        place,
        region: fd.get("region") || null,
        cost: fd.get("cost") || null,
        description: fd.get("description") || null,
        source: "user",
      };
      if (starts) payload.starts_at = starts;
      try {
        const a = await api("/activities", { method: "POST", body: JSON.stringify(payload) });
        const user = UserStore.get();
        if (openNowChk.checked && user) {
          const mPayload = {
            activity_id: a.activity_id,
            host_id: user.user_id,
            name: (fd.get("meetup_name") || "").trim() || `${title} 같이 뛰어요`,
            capacity: Number(fd.get("capacity") || 4),
            place_name: place,
            how: fd.get("how") || null,
            gender_filter: fd.get("gender_filter") || null,
            age_filter: fd.get("age_filter") || null,
          };
          if (starts) mPayload.meet_at = starts;
          await api("/meetups", { method: "POST", body: JSON.stringify(mPayload) });
        }
        setStatus(document.getElementById("status"), `등록 완료! 상세 화면으로 이동합니다 (#${a.activity_id})`, true);
        setTimeout(() => { location.href = `activity.html?id=${a.activity_id}`; }, 700);
      } catch (err) {
        setStatus(document.getElementById("status"), err.message, false);
      }
    });
  </script>
</body>
</html>
