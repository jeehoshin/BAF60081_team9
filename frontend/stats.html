<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>데이터 분석 · 같이 갈래?</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="styles.css?v=campus4">
  <style>
    /* KOPIS 통계: 이름이 긴 장르·시도와 퍼센트 값이 들어가도록 칸을 넓힌다 */
    .barlist.wide .barrow { grid-template-columns: 104px 1fr 64px; }
    .barlist.wide .barrow span:last-child { text-align: right; }
    .pairrow { display: grid; grid-template-columns: 104px 1fr 120px; gap: 8px; align-items: center; font-size: 0.85rem; }
    .pairrow .tracks { display: grid; gap: 3px; }
    .pairrow .tracks .bartrack { height: 6px; }
    .pairrow .tracks .bartrack.alt i { opacity: 0.45; }
    .pairrow span:last-child { text-align: right; color: var(--muted); }
    .legend { display: flex; gap: 14px; font-size: 0.8rem; color: var(--muted); margin: 0 0 6px; }
    .legend .bartrack { display: inline-block; width: 18px; height: 6px; vertical-align: middle; margin-right: 4px; }
    .legend .bartrack i { width: 100%; }
    .legend .bartrack.alt i { opacity: 0.45; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="topnav" data-active="stats"></nav>

    <header class="hero with-buddy">
      <div>
        <div class="badge">수집 데이터 · 기초 분석</div>
        <h1>같이 갈래?</h1>
        <p>지역·유형 분포와 모임 현황. 친구가 합류할수록 그래프가 살아납니다.</p>
      </div>
      <img class="buddy-sm" data-mascot src="mascot.svg" alt="">
    </header>

    <section class="panel">
      <h2>한눈에 보기</h2>
      <div class="grid stats" id="kpi"></div>
      <p class="status" id="status">불러오는 중…</p>
    </section>

    <section class="panel">
      <h2>활동 · 지역별</h2>
      <div class="barlist" id="byRegion"></div>
    </section>
    <section class="panel">
      <h2>활동 · 유형별</h2>
      <div class="barlist" id="byType"></div>
    </section>
    <section class="panel">
      <h2>이용자 · 연령대</h2>
      <div class="barlist" id="byAge"></div>
    </section>

    <section class="panel">
      <h2>공연 시장 · KOPIS 통계 (전국)</h2>
      <p class="hint" id="kopisPeriod">불러오는 중…</p>
      <div class="grid stats" id="kopisKpi"></div>
    </section>
    <section class="panel">
      <h2>시·도별 티켓 판매액 비중</h2>
      <p class="hint">상위 10개 시·도와 대전. 비중은 전국 합계 대비입니다.</p>
      <div class="barlist wide" id="kopisArea"></div>
    </section>
    <section class="panel">
      <h2>장르별 · 상연 횟수와 판매액</h2>
      <p class="hint">많이 열리는 장르와 돈이 되는 장르가 같은지 봅니다.</p>
      <div class="legend"><span><span class="bartrack"><i></i></span>판매액 비중</span><span><span class="bartrack alt"><i></i></span>상연 횟수 비중</span></div>
      <div class="barlist" id="kopisGenre"></div>
    </section>
    <section class="panel">
      <h2>요일별 하루 평균 관객 수</h2>
      <div class="barlist wide" id="kopisWeek"></div>
      <p class="hint" id="kopisNotice" style="margin-top:14px"></p>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const { api, setStatus, escapeHtml } = window.Gachi;

    function bars(el, items, fmt = (v) => v) {
      const max = Math.max(...items.map((i) => i.count), 1);
      el.innerHTML = items.map((i) => `
        <div class="barrow">
          <span>${escapeHtml(i.key)}</span>
          <div class="bartrack"><i style="width:${(i.count / max) * 100}%"></i></div>
          <span>${fmt(i.count)}</span>
        </div>
      `).join("") || `<p class="hint">데이터 없음</p>`;
    }

    // KOPIS 통계 (지표 A·B·C). 한 번만 불러온다 (월 단위 집계라 자주 바뀌지 않음)
    const pct = (v) => `${v}%`;
    const num = (v) => Number(v).toLocaleString("ko-KR");

    function pairBars(el, items) {
      const max = Math.max(...items.flatMap((i) => [i.amount_share, i.performance_share]), 1);
      el.innerHTML = items.map((i) => `
        <div class="pairrow">
          <span>${escapeHtml(i.key)}</span>
          <div class="tracks">
            <div class="bartrack"><i style="width:${(i.amount_share / max) * 100}%"></i></div>
            <div class="bartrack alt"><i style="width:${(i.performance_share / max) * 100}%"></i></div>
          </div>
          <span>${i.amount_share}% / ${i.performance_share}%</span>
        </div>
      `).join("") || `<p class="hint">데이터 없음</p>`;
    }

    async function loadKopis() {
      const period = document.getElementById("kopisPeriod");
      try {
        const k = await api("/stats/kopis");
        if (!k.available) {
          period.textContent = k.message;
          return;
        }
        const h = k.highlights;
        period.textContent = `${k.period.from} ~ ${k.period.to} · 공연예술통합전산망 연계 예매처 발권 기준`;
        document.getElementById("kopisKpi").innerHTML = `
          <div class="stat"><span>서울 판매액 비중</span><b>${h.seoul_amount_share ?? "-"}%</b></div>
          <div class="stat"><span>대전 판매액 비중</span><b>${h.daejeon_amount_share ?? "-"}%</b></div>
          <div class="stat"><span>서울 상연 횟수 비중</span><b>${h.seoul_performance_share ?? "-"}%</b></div>
          <div class="stat"><span>주말(토·일) 관객 비중</span><b>${h.weekend_audience_share}%</b></div>
        `;
        const top = k.by_area.slice(0, 10);
        const dj = k.by_area.find((a) => a.key === "대전");
        if (dj && !top.includes(dj)) top.push(dj);
        bars(document.getElementById("kopisArea"), top.map((a) => ({ key: a.key, count: a.amount_share })), pct);
        pairBars(document.getElementById("kopisGenre"), k.by_genre);
        bars(document.getElementById("kopisWeek"), k.by_weekday.map((d) => ({ key: d.key, count: d.avg_audience })), num);
        document.getElementById("kopisNotice").textContent = `${k.notice} ${k.attribution}`;
      } catch (e) {
        period.textContent = `KOPIS 통계를 불러오지 못했어요: ${e.message}`;
      }
    }

    async function load() {
      try {
        const [acts, meets, users] = await Promise.all([
          api("/stats/activities"),
          api("/stats/meetups"),
          api("/stats/users"),
        ]);
        document.getElementById("kpi").innerHTML = `
          <div class="stat"><span>수집 활동</span><b>${acts.total}</b></div>
          <div class="stat"><span>열린 모임</span><b>${meets.open_meetups}</b></div>
          <div class="stat"><span>참여 인원</span><b>${meets.participants}</b></div>
          <div class="stat"><span>평균 충원율</span><b>${meets.avg_fill_rate_percent}%</b></div>
          <div class="stat"><span>등록 이용자</span><b>${users.total}</b></div>
        `;
        bars(document.getElementById("byRegion"), acts.by_region);
        bars(document.getElementById("byType"), acts.by_type);
        bars(document.getElementById("byAge"), users.by_age_group);
        setStatus(document.getElementById("status"), "최신 통계 반영", true);
      } catch (e) {
        setStatus(document.getElementById("status"), e.message, false);
      }
    }
    load();
    loadKopis();
    setInterval(() => { if (!document.hidden) load(); }, 15000);
  </script>
</body>
</html>
